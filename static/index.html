<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026世界杯竞猜</title>
<style>
:root {
  --primary: #1a1a2e;
  --secondary: #16213e;
  --accent: #e94560;
  --gold: #fbbf24;
  --green: #22c55e;
  --bg: #0f0f1a;
  --card: #1e1e32;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --border: #2d2d4a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* 顶部 */
.header {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  padding: 20px 16px;
  text-align: center;
  border-bottom: 3px solid var(--accent);
}
.header h1 { font-size: 22px; font-weight: 700; }
.header h1 span { color: var(--gold); }
.header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
.user-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}
.user-bar input {
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  color: white;
  font-size: 14px;
  width: 150px;
  outline: none;
}
.user-bar input:focus { border-color: var(--accent); }
.user-bar button {
  background: var(--accent);
  border: none;
  color: white;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
}
.user-bar button:hover { opacity: 0.9; }
.user-info {
  font-size: 14px;
  color: var(--gold);
  font-weight: 600;
}
.user-info .logout {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  margin-left: 8px;
}

/* Tab导航 */
.tabs {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.tab {
  flex: 1;
  min-width: 60px;
  padding: 12px 8px;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}
.tab .tab-icon { font-size: 18px; display: block; margin-bottom: 2px; }

/* 内容区 */
.content { max-width: 800px; margin: 0 auto; padding: 12px; }
.page { display: none; }
.page.active { display: block; }

/* 卡片 */
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--gold);
}

/* 积分榜 */
.group-block { margin-bottom: 20px; }
.group-header {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
  padding: 8px 0;
  border-bottom: 2px solid var(--accent);
  margin-bottom: 8px;
}
.standings-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.standings-table th {
  text-align: left;
  padding: 6px 4px;
  color: var(--muted);
  font-weight: 500;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
}
.standings-table td {
  padding: 6px 4px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.standings-table .rank-num { color: var(--muted); font-size: 12px; width: 20px; }
.standings-table .team-name { font-weight: 600; }
.standings-table .qualified { color: var(--green); }
.standings-table .eliminated { color: var(--muted); }
.pts { font-weight: 700; color: var(--gold); }

/* 比赛卡片 */
.match-card {
  background: var(--card);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.match-card.finished { border-left: 4px solid var(--green); }
.match-card.live { border-left: 4px solid var(--accent); }
.match-card.upcoming { border-left: 4px solid var(--muted); }
.match-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}
.match-teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.team-block {
  text-align: center;
  flex: 1;
}
.team-block .flag { font-size: 28px; }
.team-block .name { font-size: 14px; font-weight: 600; margin-top: 4px; }
.match-score {
  font-size: 28px;
  font-weight: 800;
  color: var(--gold);
  text-align: center;
  min-width: 60px;
}
.match-score .vs { font-size: 16px; color: var(--muted); }
.match-bet-btn {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.match-bet-btn:hover { opacity: 0.9; }
.match-bet-btn:disabled {
  background: var(--border);
  color: var(--muted);
  cursor: not-allowed;
}
.match-bet-info {
  text-align: center;
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
}
.match-bet-info .bet-placed {
  color: var(--gold);
  font-weight: 600;
}
.match-result-info {
  text-align: center;
  margin-top: 8px;
  font-size: 13px;
}
.match-result-info .correct { color: var(--green); }
.match-result-info .wrong { color: var(--accent); }
.bettor-count {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin-top: 4px;
}

/* 竞猜弹窗 */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 999;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card);
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 400px;
  border: 1px solid var(--border);
}
.modal h3 { font-size: 18px; margin-bottom: 4px; }
.modal .modal-match-info { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.result-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.result-btn {
  flex: 1;
  padding: 12px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.result-btn:hover { border-color: var(--muted); }
.result-btn.selected { border-color: var(--gold); background: rgba(251,191,36,0.1); color: var(--gold); }
.score-inputs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 16px;
}
.score-inputs input {
  width: 70px;
  padding: 10px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  background: rgba(255,255,255,0.1);
  border: 2px solid var(--border);
  border-radius: 10px;
  color: white;
  outline: none;
}
.score-inputs input:focus { border-color: var(--gold); }
.score-inputs .sep { font-size: 20px; color: var(--muted); font-weight: 700; }
.modal-submit {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}
.modal-submit:hover { opacity: 0.9; }
.modal-close {
  width: 100%;
  padding: 10px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  margin-top: 8px;
}
.modal-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }

/* 排行榜 */
.leaderboard-item {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.leaderboard-item:last-child { border-bottom: none; }
.lb-rank {
  width: 36px;
  font-size: 18px;
  font-weight: 800;
  color: var(--muted);
  text-align: center;
}
.lb-rank.gold { color: var(--gold); }
.lb-rank.silver { color: #94a3b8; }
.lb-rank.bronze { color: #cd7f32; }
.lb-info { flex: 1; margin-left: 12px; }
.lb-name { font-weight: 600; font-size: 15px; }
.lb-stats { font-size: 12px; color: var(--muted); margin-top: 2px; }
.lb-stars {
  font-size: 22px;
  font-weight: 800;
  color: var(--gold);
  text-align: right;
  min-width: 50px;
}
.lb-stars small { font-size: 13px; font-weight: 400; }

/* 个人页 */
.my-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--card);
  border-radius: 10px;
  padding: 14px;
  text-align: center;
  border: 1px solid var(--border);
}
.stat-card .num { font-size: 28px; font-weight: 800; color: var(--gold); }
.stat-card .label { font-size: 12px; color: var(--muted); margin-top: 4px; }

.bet-history-item {
  display: flex;
  align-items: center;
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  gap: 10px;
}
.bet-history-item:last-child { border-bottom: none; }
.bh-teams { flex: 1; font-size: 13px; font-weight: 600; }
.bh-bet { font-size: 12px; color: var(--muted); }
.bh-result {
  font-size: 20px;
  text-align: center;
  min-width: 40px;
}
.bh-stars {
  font-size: 18px;
  color: var(--gold);
  text-align: center;
  min-width: 30px;
}
.bh-time { font-size: 11px; color: var(--muted); }

/* 时间筛选 */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}
.filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.filter-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* 分组下拉 */
.group-select { margin-bottom: 12px; }
.group-select select {
  width: 100%;
  padding: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: white;
  font-size: 14px;
  outline: none;
}

/* 状态标签 */
.status-badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
}
.status-badge.upcoming { background: rgba(148,163,184,0.2); color: var(--muted); }
.status-badge.live { background: rgba(233,69,96,0.2); color: var(--accent); animation: pulse 1.5s infinite; }
.status-badge.finished { background: rgba(34,197,94,0.2); color: var(--green); }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }

/* 星星动画 */
.star-anim {
  display: inline-block;
  animation: starPop 0.5s ease-out;
}
@keyframes starPop {
  0% { transform: scale(0); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

function getResults() {
  try { return JSON.parse(localStorage.getItem('wc2026_results') || '{}'); } catch(e) { return {}; }
}
function setResults(results) {
  localStorage.setItem('wc2026_results', JSON.stringify(results));
}
function getBetsAll() {
  try { return JSON.parse(localStorage.getItem('wc2026_bets') || '{}'); } catch(e) { return {}; }
}
function setBetsAll(bets) {
  localStorage.setItem('wc2026_bets', JSON.stringify(bets));
}
function saveBet(matchId, nickname, homeScore, awayScore) {
  let allBets = getBetsAll();
  if (!allBets[matchId]) allBets[matchId] = {};
  allBets[matchId][nickname] = { home_score: homeScore, away_score: awayScore, predicted_result: homeScore > awayScore ? 'home' : (homeScore < awayScore ? 'away' : 'draw'), bet_at: new Date().toISOString() };
  setBetsAll(allBets);
}
function getMatchBets(matchId) {
  return getBetsAll()[matchId] || {};
}
function getUserBets(nickname) {
  let allBets = getBetsAll();

  for (let mid in allBets) {
    for (let nick in allBets[mid]) {
      if (nick === nickname) {
        let match = MATCHES_DATA.find(m => m.id === mid);
        if (match) {
          let bet = allBets[mid][nick];
          let results = getResults();
          let result = results[mid];
          let wonScore = false, wonResult = false, starsEarned = 0;

            wonScore = bet.home_score === result.home_score && bet.away_score === result.away_score;
            wonResult = bet.predicted_result === result.status;
            if (wonScore) starsEarned = 3;
            else if (wonResult) starsEarned = 1;
          }
          userBets.push({
            match_id: mid, match: match, bet: bet,
            home_score: bet.home_score, away_score: bet.away_score, predicted_result: bet.predicted_result,
            won_score: wonScore, won_result: wonResult, stars_earned: starsEarned,
            bet_at: bet.bet_at
          });
        }
      }
    }
  }
  return userBets.sort((a, b) => (b.match.time || '').localeCompare(a.match.time || ''));
}
function getAllUsers() {
  let allBets = getBetsAll();
  let users = new Set();
  for (let mid in allBets) {
    for (let nick in allBets[mid]) {
      users.add(nick);
    }
  }
  return [...users];
}
function calcStandings() {
  let results = getResults();
  let groups = {};
  for (let m of MATCHES_DATA) {
    let g = m.group || 'A';
    if (!groups[g]) groups[g] = {};
    let r = results[m.id];
    if (r) {
      if (!groups[g][m.home_team]) groups[g][m.home_team] = {team: m.home_team, played: 0, win: 0, draw: 0, loss: 0, goals_for: 0, goals_against: 0, pts: 0};
      if (!groups[g][m.away_team]) groups[g][m.away_team] = {team: m.away_team, played: 0, win: 0, draw: 0, loss: 0, goals_for: 0, goals_against: 0, pts: 0};
      groups[g][m.home_team].played++;
      groups[g][m.home_team].goals_for += r.home_score;
      groups[g][m.home_team].goals_against += r.away_score;
      groups[g][m.away_team].played++;
      groups[g][m.away_team].goals_for += r.away_score;
      groups[g][m.away_team].goals_against += r.home_score;
      if (r.home_score > r.away_score) { groups[g][m.home_team].win++; groups[g][m.home_team].pts += 3; groups[g][m.away_team].loss++; }
      else if (r.home_score < r.away_score) { groups[g][m.away_team].win++; groups[g][m.away_team].pts += 3; groups[g][m.home_team].loss++; }
      else { groups[g][m.home_team].draw++; groups[g][m.home_team].pts += 1; groups[g][m.away_team].draw++; groups[g][m.away_team].pts += 1; }
    }
  }
  let result = {};
  for (let g in groups) {
    let teams = Object.values(groups[g]).sort((a, b) => b.pts - a.pts || (b.goals_for - b.goals_against) - (a.goals_for - a.goals_against) || b.goals_for - a.goals_for);
    if (teams.length > 0) result[g] = teams;
  }
  return result;
}
function calcLeaderboard() {
  let results = getResults();
  let allBets = getBetsAll();
  let users = getAllUsers();
  let board = [];
  for (let user of users) {
    let totalBets = 0, resultCorrect = 0, scoreCorrect = 0;
    for (let mid in allBets) {
      let bet = allBets[mid][user];
      if (!bet) continue;
      let result = results[mid];
      if (!result) continue;
      totalBets++;
      let predictedResult = bet.predicted_result;
      let actualResult = result.status || (result.home_score > result.away_score ? 'home' : result.home_score < result.away_score ? 'away' : 'draw');
      let wonResult = predictedResult === actualResult;
      let wonScore = bet.home_score === result.home_score && bet.away_score === result.away_score;
      if (wonResult) resultCorrect++;
      if (wonScore) scoreCorrect++;
    }
    if (totalBets > 0) {
      let stars = resultCorrect + scoreCorrect * 2;
      board.push({ nickname: user, total_bets: totalBets, result_correct: resultCorrect, score_correct: scoreCorrect, stars: stars, accuracy: Math.round(resultCorrect / totalBets * 100) });
    }
  }
  return board.sort((a, b) => b.stars - a.stars || b.total_bets - a.total_bets);
}
function resetAllData() {
  if (confirm('确定重置所有竞猜和比赛结果数据？')) {
    localStorage.removeItem('wc2026_bets');
    localStorage.removeItem('wc2026_results');
    loadAll();
  }
}
function exportBetsData() {
  let data = { results: getResults(), bets: getBetsAll(), exported_at: new Date().toISOString() };
  let blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'worldcup2026_data.json';
  a.click();
}
function importBetsData(jsonStr) {
  try {
    let data = JSON.parse(jsonStr);
    if (data.results) setResults(data.results);
    if (data.bets) setBetsAll(data.bets);
    loadAll();
    return true;
  } catch(e) { return false; }
}

// 给管理员使用 - 通过URL参数激活管理功能
const IS_ADMIN = location.hash === '#admin' || location.search.includes('admin');
let adminResults = getResults();

document.addEventListener('click', function(e) {
  let card = e.target.closest('.match-card.finished');
  if (card && IS_ADMIN) {
    let mid = card.dataset.matchId;
    if (!mid) return;
    let m = MATCHES_DATA.find(x => x.id === mid);
    if (!m) return;
    let hs = prompt(`输入 ${m.home_team} 的进球数:`);
    if (hs === null) return;
    let as_ = prompt(`输入 ${m.away_team} 的进球数:`);
    if (as_ === null) return;
    hs = parseInt(hs); as_ = parseInt(as_);
    if (isNaN(hs) || isNaN(as_) || hs < 0 || as_ < 0 || hs > 20 || as_ > 20) { alert('请输入有效比分(0-20)'); return; }
    let r = getResults();
    r[mid] = { home_score: hs, away_score: as_, status: hs > as_ ? 'home' : (hs < as_ ? 'away' : 'draw') };
    setResults(r);
    adminResults = getResults();
    loadAll();
    alert(`✅ ${m.home_team} ${hs}:${as_} ${m.away_team} 已结算`);
  }
});
