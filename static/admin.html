<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026世界杯竞猜 · 管理后台</title>
<style>
:root {
  --bg: #0f0f1a; --card: #1e1e32; --text: #e2e8f0; --muted: #94a3b8;
  --accent: #e94560; --green: #22c55e; --gold: #fbbf24; --border: #2d2d4a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background: var(--bg); color: var(--text); padding: 20px; max-width: 1000px; margin: 0 auto;
}
h1 { font-size: 24px; margin-bottom: 20px; color: var(--gold); }
h2 { font-size: 18px; margin: 20px 0 12px; }
.header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.stat-box { background: var(--card); padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border); min-width: 100px; }
.stat-box .num { font-size: 28px; font-weight: 800; color: var(--gold); }
.stat-box .label { font-size: 13px; color: var(--muted); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar button, .import-label {
  padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
}
.btn-green { background: var(--green); color: white; }
.btn-blue { background: #3b82f6; color: white; }
.btn-red { background: var(--accent); color: white; }
.import-label { display: inline-block; }
input[type="file"] { display: none; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.filter-btn {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px;
}
.filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.match-item {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 8px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
}
.match-item .info { font-size: 12px; color: var(--muted); flex: 0 0 100%; }
.match-item .teams { font-size: 15px; font-weight: 600; flex: 1; min-width: 200px; }
.match-item.finished { border-left: 4px solid var(--green); }
.match-item .result-display { color: var(--green); font-weight: 700; font-size: 18px; margin: 0 10px; }
.match-item .edit-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.match-item .edit-form input {
  width: 50px; padding: 8px; text-align: center; background: rgba(255,255,255,0.1); border: 1px solid var(--border);
  border-radius: 6px; color: white; font-size: 16px;
}
.match-item .edit-form button {
  padding: 8px 16px; background: var(--green); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
}
.match-item .edit-form button:hover { opacity: 0.85; }
.empty { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>

<h1>⚽ 2026世界杯竞猜 · 管理后台</h1>
<p style="color:var(--muted);margin-bottom:20px;">💡 此页面纯前端运行，数据存储在浏览器本地。⚠️ 切换到其他浏览器会丢失数据，请定期导出备份。</p>

  <div class="stat-box"><div class="num" id="totalBets">0</div><div class="label">总竞猜数</div></div>
</div>

<div class="toolbar">

  <input type="file" id="importFile" accept=".json" onchange="importData(event)">
  <button class="btn-red" onclick="resetData()">🗑️ 重置所有</button>
</div>

function getResults() { try { return JSON.parse(localStorage.getItem('wc2026_results')||'{}'); } catch(e) { return {}; } }
function setResults(r) { localStorage.setItem('wc2026_results', JSON.stringify(r)); }
function getBets() { try { return JSON.parse(localStorage.getItem('wc2026_bets')||'{}'); } catch(e) { return {}; } }
function getUsers() {
  let bets = getBets(); let s = new Set();
  for (let mid in bets) { for (let nick in bets[mid]) s.add(nick); }
  return [...s];
}

function render() {
  let results = getResults();
  let bets = getBets();
  let users = getUsers();

  let totalBets = 0;
  for (let mid in bets) totalBets += Object.keys(bets[mid]).length;

  document.getElementById('totalMatches').textContent = MATCHES_DATA.length;
  document.getElementById('finishedMatches').textContent = Object.keys(results).length;
  document.getElementById('totalUsers').textContent = users.length;
  document.getElementById('totalBets').textContent = totalBets;

  // 筛选按钮
  let groups = [...new Set(MATCHES_DATA.map(m => m.group))].sort();
  let fb = document.getElementById("filterBar");
  fb.innerHTML = '<button class="filter-btn active" data-group="">全部</button><button class="filter-btn" data-group="A">A</button><button class="filter-btn" data-group="B">B</button><button class="filter-btn" data-group="C">C</button><button class="filter-btn" data-group="D">D</button><button class="filter-btn" data-group="E">E</button><button class="filter-btn" data-group="F">F</button><button class="filter-btn" data-group="G">G</button><button class="filter-btn" data-group="H">H</button><button class="filter-btn" data-group="I">I</button><button class="filter-btn" data-group="J">J</button><button class="filter-btn" data-group="K">K</button><button class="filter-btn" data-group="L">L</button>';
  document.querySelectorAll(".filter-btn").forEach(function(b, i) {
    b.onclick = function() { filterGroup(this, this.dataset.group || ""); };
  });

  // 比赛列表
  renderMatchList('', results, bets);
}

let currentFilter = '';

function filterGroup(el, g) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  currentFilter = g;
  renderMatchList(g, getResults(), getBets());
}

function renderMatchList(filter, results, bets) {
  let filtered = filter ? MATCHES_DATA.filter(m => m.group === filter) : MATCHES_DATA;
  let el = document.getElementById('matchList');
  if (filtered.length === 0) { el.innerHTML = '<div class="empty">暂无比赛</div>'; return; }
  let html = '';
  for (let m of filtered) {
    let r = results[m.id];
    let isFinished = r || m.status === 'finished';
    html += '<div class="match-item' + (isFinished ? ' finished' : '') + '">';
    html += '<div class="info">' + m.group + '组 · ' + m.time + ' · ' + (m.venue||'') + '</div>';
    html += '<div class="teams">' + m.home_team + ' vs ' + m.away_team + '</div>';
    if (isFinished) {
      html += '<div class="result-display">' + (r ? r.home_score : m.home_score) + ':' + (r ? r.away_score : m.away_score) + '</div>';
      html += '<button onclick="editResult(\'' + m.id + '\')" style="padding:6px 12px;border:none;border-radius:6px;background:#3b82f6;color:white;cursor:pointer;font-size:13px;">修改</button>';
    } else {
      html += '<div class="edit-form">';
      html += '<input id="hs_' + m.id + '" type="number" min="0" max="20" placeholder="主">';
      html += '<span style="color:var(--muted)">:</span>';
      html += '<input id="as_' + m.id + '" type="number" min="0" max="20" placeholder="客">';
      html += '<button onclick="saveResult(\'' + m.id + '\')">✅ 结算</button>';
      html += '</div>';
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

function saveResult(mid) {
  let m = MATCHES_DATA.find(x => x.id === mid);
  if (!m) return;
  let hs = parseInt(document.getElementById('hs_' + mid).value);
  let as_ = parseInt(document.getElementById('as_' + mid).value);
  if (isNaN(hs) || isNaN(as_) || hs < 0 || as_ > 20) { alert('请输入有效比分(0-20)'); return; }
  if (!confirm(m.home_team + ' ' + hs + ':' + as_ + ' ' + m.away_team + ' - 确定结算？')) return;
  let r = getResults();
  r[mid] = { home_score: hs, away_score: as_, status: hs > as_ ? 'home' : (hs < as_ ? 'away' : 'draw') };
  setResults(r);
  render();
}

function editResult(mid) {
  let m = MATCHES_DATA.find(x => x.id === mid);
  if (!m) return;
  let r = getResults()[mid] || { home_score: m.home_score, away_score: m.away_score };
  let hs = prompt(m.home_team + ' 进球数:', r.home_score);
  if (hs === null) return;
  let as_ = prompt(m.away_team + ' 进球数:', r.away_score);
  if (as_ === null) return;
  hs = parseInt(hs); as_ = parseInt(as_);
  if (isNaN(hs) || isNaN(as_) || hs < 0 || as_ > 20) { alert('输入无效'); return; }
  let results = getResults();
  results[mid] = { home_score: hs, away_score: as_, status: hs > as_ ? 'home' : (hs < as_ ? 'away' : 'draw') };
  setResults(results);
  render();
}

function exportData() {
  let data = { results: getResults(), bets: getBets(), exported_at: new Date().toISOString() };
  let blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  let a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  let now = new Date(); let ds = now.getFullYear()+''+(now.getMonth()+1)+''+now.getDate();
  a.download = 'wc2026_' + ds + '.json'; a.click();
}

function importData(e) {
  let file = e.target.files[0]; if (!file) return;
  let reader = new FileReader();
  reader.onload = function(ev) {
    try {
      let data = JSON.parse(ev.target.result);
      if (data.results) setResults(data.results);
      if (data.bets) localStorage.setItem('wc2026_bets', JSON.stringify(data.bets));
      render();
      alert('✅ 导入成功！比赛结果 ' + Object.keys(data.results||{}).length + ' 条，竞猜数据已恢复');
    } catch(err) { alert('❌ 文件格式错误'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function resetData() {
  if (!confirm('⚠️ 确定要清除所有竞猜数据和比赛结果？此操作不可撤销！')) return;
  if (!confirm('再次确认：删除所有数据？')) return;
  localStorage.removeItem('wc2026_results');
  localStorage.removeItem('wc2026_bets');
  render();
}

render();
</script>
